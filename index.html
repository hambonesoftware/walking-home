<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walking Home</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#232f50;color:#f4e2c8;font:16px system-ui}main{position:relative;height:100dvh;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}header,details,footer{position:absolute;z-index:1}header{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));padding:9px 13px;background:#151b29e8;border-radius:8px}h1{margin:0;font:600 clamp(19px,4vw,27px) Georgia,serif}#status{color:#f6b574;font-size:13px}details{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));max-width:calc(100% - 24px);background:#151b29f5;border:1px solid #79674e;border-radius:8px}summary,button,select{min-height:44px}summary{padding:11px;cursor:pointer}aside{padding:0 12px 12px;display:grid;gap:9px}label{display:flex;gap:12px;justify-content:space-between;align-items:center}input{width:105px;accent-color:#eda868}button,select{color:inherit;background:#292e40;border:1px solid #947c61;border-radius:8px;padding:6px 10px;font:inherit}button[aria-pressed="true"]{border-color:#f6b574}button:active{background:#785639}footer{bottom:max(12px,env(safe-area-inset-bottom));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));pointer-events:none}#desktop{display:inline-block;background:#151b29e8;padding:8px 12px;border-radius:8px}#touch{display:none}#touch button{pointer-events:auto;touch-action:none;user-select:none;min-width:50px;min-height:50px}#pad{display:grid;grid-template-columns:repeat(3,50px);gap:5px}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1}#run{align-self:end;min-width:68px}
@media(pointer:coarse),(max-width:650px){#desktop{display:none}#touch{display:flex;justify-content:space-between;align-items:end}}
</style>
</head>
<body><main>
<canvas aria-label="Playable 3D character"></canvas>
<header><h1>Walking Home</h1><span id="status" role="status">Loading…</span></header>
<details><summary>Character</summary><aside aria-label="Character controls">
<label>Jacket <select id="coat"><option value="#654031">Tobacco</option><option value="#37465e">Indigo</option><option value="#584e32">Olive</option></select></label>
<label>Jaw width <input id="jaw" type="range" min="0.84" max="1.16" step=".01" value="1"></label>
<label>Expression <select id="expression"><option value="smile">Half-smile</option><option value="focus">Focused</option></select></label>
<button id="reference-pose" aria-pressed="true">Reference pose</button>
<button id="reset">Reset view</button></aside></details>
<footer><span id="desktop">WASD / arrows · move &nbsp; Shift · run &nbsp; Drag · orbit</span>
<div id="touch"><div id="pad"><button data-key="w" aria-label="Forward">▲</button><button data-key="a" aria-label="Left">◀</button><button data-key="s" aria-label="Back">▼</button><button data-key="d" aria-label="Right">▶</button></div><button id="run" data-key="shift" aria-label="Hold to run">Run</button></div></footer>
</main><script type="module" src="./play.js"></script></body></html>
